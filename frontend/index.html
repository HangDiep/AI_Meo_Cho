<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Mask Detection System</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body{
            background:#faf8ff;
            font-family: Inter, sans-serif;
            overflow-x: hidden;
        }

        .glass{
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(12px);
        }

        .card{
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .live-glow{
            box-shadow: 0 0 20px rgba(16,185,129,0.2);
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header class="bg-emerald-600 text-white px-8 py-5 flex justify-between items-center shadow-lg">

    <div>
        <h1 class="text-3xl font-bold tracking-wide">
            AI MASK DETECTION
        </h1>

        <p class="text-sm opacity-80 mt-1">
            Real-time Face Mask Monitoring System
        </p>
    </div>

    <a href="/about"
       class="bg-white/20 hover:bg-white/30 px-5 py-3 rounded-xl font-semibold transition">
        About Project
    </a>

</header>


<!-- MAIN -->
<div class="grid xl:grid-cols-3 gap-6 p-6">

    <!-- LEFT -->
    <div class="xl:col-span-2 space-y-6">

        <!-- WEBCAM -->
        <div class="card overflow-hidden">

            <div class="bg-emerald-500 px-6 py-4 text-white flex justify-between items-center">

                <div>
                    <h2 class="text-2xl font-bold">
                        Realtime Camera Detection
                    </h2>

                    <p class="text-sm opacity-80">
                        AI Webcam Monitoring
                    </p>
                </div>

                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-green-300 animate-pulse"></div>

                    <span class="font-semibold">
                        LIVE
                    </span>
                </div>

            </div>

            <div class="relative live-glow">

                <img id="webcamStream"
                     src=""
                     class="w-full h-[600px] object-cover bg-black">

                

            </div>

            <!-- BUTTON -->
            <div class="p-5 flex gap-4">

                <button id="startCameraBtn"
                        class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold transition">
                    START CAMERA
                </button>

                <button id="stopCameraBtn"
                        class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-bold transition">
                    STOP CAMERA
                </button>

            </div>

        </div>


        <!-- IMAGE UPLOAD SECTION -->
        <div class="card p-6">
            <h2 class="text-2xl font-bold text-emerald-600 mb-6">Image Upload Detection</h2>
            
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Upload Area -->
                <div>
                    <label id="dropZone" class="border-2 border-dashed border-emerald-400 rounded-3xl p-12 flex flex-col items-center justify-center cursor-pointer hover:border-emerald-500 transition">
                        <input type="file" id="imageInput" accept="image/*" class="hidden">
                        <div class="text-6xl mb-4">📸</div>
                        <p class="font-semibold text-lg">Click or drop image here</p>
                        <p class="text-gray-500 text-sm mt-1">JPG, PNG supported</p>
                    </label>

                    <button id="predictBtn" 
                            class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-bold text-lg transition">
                        ANALYZE IMAGE
                    </button>
                </div>

                <!-- Preview & Result Image -->
                <div>
                    <p class="text-sm text-gray-500 mb-2">Ảnh gốc</p>
                    <img id="previewImage" class="w-full h-80 object-cover rounded-3xl border hidden">

                    <p class="text-sm text-gray-500 mt-6 mb-2">Kết quả AI (có khung)</p>
                    <img id="resultImage" class="w-full h-80 object-cover rounded-3xl border hidden">

                    <div id="resultBox" class="mt-6 bg-gray-50 rounded-3xl p-5 text-sm min-h-[180px]">
                        <p class="text-gray-400 text-center">Upload ảnh để phân tích</p>
                    </div>
                </div>
            </div>
        </div>

    </div>


    <!-- RIGHT COLUMN -->
    <div class="space-y-6">
        <div class="card p-6">
            <h2 class="text-2xl font-bold text-emerald-600 mb-6">Image Statistics</h2>
            <div class="space-y-4">
                <div class="bg-green-100 p-5 rounded-2xl">
                    <p class="font-semibold text-green-800">With Mask</p>
                    <h3 id="maskCount" class="text-5xl font-bold text-green-700 mt-1">0</h3>
                </div>
                <div class="bg-yellow-100 p-5 rounded-2xl">
                    <p class="font-semibold text-yellow-800">Incorrect Mask</p>
                    <h3 id="wrongMaskCount" class="text-5xl font-bold text-yellow-700 mt-1">0</h3>
                </div>
                <div class="bg-red-100 p-5 rounded-2xl">
                    <p class="font-semibold text-red-800">Without Mask</p>
                    <h3 id="noMaskCount" class="text-5xl font-bold text-red-700 mt-1">0</h3>
                </div>
                <div class="bg-blue-100 p-5 rounded-2xl">
                    <p class="font-semibold text-blue-800">Total</p>
                    <h3 id="totalPeople" class="text-5xl font-bold text-blue-700 mt-1">0</h3>
                </div>
            </div>
        </div>
    </div>
</div>



<script>

const webcamImg = document.getElementById('webcamStream');

const startBtn = document.getElementById('startCameraBtn');
const stopBtn = document.getElementById('stopCameraBtn');

const statusEl = document.getElementById('cameraStatus');

const predictionEl = document.getElementById('predictionResult');


// CAMERA
startBtn.onclick = () => {

    webcamImg.src = "/video_feed";

    statusEl.innerText = "Online";
    statusEl.classList.remove("text-red-500");
    statusEl.classList.add("text-green-500");

    predictionEl.innerText = "Realtime AI detection started...";
};


stopBtn.onclick = () => {

    webcamImg.src = "";

    statusEl.innerText = "Offline";

    statusEl.classList.remove("text-green-500");
    statusEl.classList.add("text-red-500");

    predictionEl.innerText = "Camera stopped.";
};

// =============== IMAGE UPLOAD ===============
const imageInput = document.getElementById('imageInput');
const previewImage = document.getElementById('previewImage');
const resultImage = document.getElementById('resultImage');
const resultBox = document.getElementById('resultBox');
const predictBtn = document.getElementById('predictBtn');

let selectedFile = null;

imageInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
        previewImage.src = URL.createObjectURL(selectedFile);
        previewImage.classList.remove('hidden');
        resultImage.classList.add('hidden');
    }
});

predictBtn.addEventListener('click', async () => {
    if (!selectedFile) {
        alert("Vui lòng chọn ảnh trước!");
        return;
    }

    resultBox.innerHTML = `
        <div class="flex justify-center items-center gap-3 text-emerald-600 py-8">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div>
            <span>Đang phân tích...</span>
        </div>`;

    const formData = new FormData();
    formData.append('image', selectedFile);

    try {
        const response = await fetch('/api/upload', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (data.status === "success") {
            // Hiển thị ảnh có khung bounding box
            if (data.image) {
                resultImage.src = `data:image/jpeg;base64,${data.image}`;
                resultImage.classList.remove('hidden');
            }

            // Cập nhật thống kê
            let withMask = 0, incorrect = 0, without = 0;
            data.results.forEach(r => {
                if (r.label.includes("With")) withMask++;
                else if (r.label.includes("Incorrect")) incorrect++;
                else without++;
            });

            document.getElementById('totalPeople').textContent = data.total_faces;
            document.getElementById('maskCount').textContent = withMask;
            document.getElementById('wrongMaskCount').textContent = incorrect;
            document.getElementById('noMaskCount').textContent = without;

            // Chi tiết
            let html = `<p class="text-xl font-bold text-emerald-700 mb-4">✅ Phát hiện ${data.total_faces} khuôn mặt</p>`;
            data.results.forEach(r => {
                const color = r.label.includes("With") ? "text-green-600" : 
                             r.label.includes("Incorrect") ? "text-amber-600" : "text-red-600";
                html += `
                    <div class="flex justify-between bg-white p-4 rounded-2xl border mb-3">
                        <span class="font-medium ${color}">${r.label}</span>
                        <span class="font-bold">${r.confidence}%</span>
                    </div>`;
            });
            resultBox.innerHTML = html;

        } else {
            resultBox.innerHTML = `<p class="text-red-500">${data.message || "Phân tích thất bại"}</p>`;
        }
    } catch (err) {
        resultBox.innerHTML = `<p class="text-red-500">Lỗi kết nối server. Vui lòng thử lại.</p>`;
    }
});

</script>

</body>
</html>
